name: Source integrity

on:
  push:
    branches: [main]
    tags: ['v*-baseline']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source (v4.2.2)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Verify source and project files without GPU dependencies
        run: python3 scripts/check_project.py
      - name: Check whitespace
        run: git diff --check
  vla-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_OFFLINE: '1'
    steps:
      - name: Checkout source (v4.2.2)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Install isolated CPU test dependencies
        run: |
          python3 -m venv .local/vla-cpu
          .local/vla-cpu/bin/python -m pip install numpy==1.26.4 PyYAML==6.0.3 scipy==1.14.1 h5py==3.12.1 swanlab==0.10.3
          .local/vla-cpu/bin/python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Test VLA, controller and tracking CPU contracts
        run: |
          .local/vla-cpu/bin/python -c "import numpy, torch, yaml; assert torch.version.cuda is None"
          .local/vla-cpu/bin/python -B -m unittest discover -s tests -p 'test_vla*.py' -v
          .local/vla-cpu/bin/python -B -m unittest discover -s tests -p test_pickorange.py -v
          .local/vla-cpu/bin/python -B -m unittest discover -s tests -p test_evo1_service_contracts.py -v
          .local/vla-cpu/bin/python -B -m unittest discover -s tests -p test_scripted_liftcube.py -v
          .local/vla-cpu/bin/python -B -m unittest discover -s tests -p test_swanlab.py -v
          .local/vla-cpu/bin/python -B -m unittest discover -s tests -p test_liftcube_training.py -v
